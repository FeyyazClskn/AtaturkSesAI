name: Build and Release Ataturk TTS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  windows:
    name: Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null

          Invoke-WebRequest `
            -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" `
            -OutFile ffmpeg.zip

          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-extract

          $ffmpeg = Get-ChildItem `
            ffmpeg-extract `
            -Filter ffmpeg.exe `
            -Recurse |
            Select-Object -First 1

          Copy-Item $ffmpeg.FullName bin\ffmpeg.exe

      - name: Build EXE
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name AtaturkTTS `
            --add-data "README.md;." `
            --add-binary "bin\ffmpeg.exe;bin" `
            ataturk_tts.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v6
        with:
          name: AtaturkTTS-Windows
          path: dist/AtaturkTTS.exe


  linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-xinerama0 \
            libxcb-cursor0

          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onefile \
            --windowed \
            --name AtaturkTTS \
            --add-data "README.md:." \
            ataturk_tts.py

      - name: Prepare Linux package
        run: |
          mkdir -p release/AtaturkTTS

          cp dist/AtaturkTTS release/AtaturkTTS/

          cp install-linux.sh release/AtaturkTTS/

          chmod +x release/AtaturkTTS/AtaturkTTS
          chmod +x release/AtaturkTTS/install-linux.sh

          tar -czf AtaturkTTS-Linux.tar.gz \
            -C release AtaturkTTS

      - name: Upload Linux package
        uses: actions/upload-artifact@v6
        with:
          name: AtaturkTTS-Linux
          path: AtaturkTTS-Linux.tar.gz


  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - windows
      - linux

    runs-on: ubuntu-latest

    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v6
        with:
          name: AtaturkTTS-Windows
          path: release

      - name: Download Linux build
        uses: actions/download-artifact@v6
        with:
          name: AtaturkTTS-Linux
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/AtaturkTTS.exe
            release/AtaturkTTS-Linux.tar.gz
